<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Diary of a Minecraft Girl</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;700&display=swap">
<style>
/* Clevicute goes first once its font file is embedded; Fredoka is the stand-in until then */
:root{--ink:#4a3350;--muted:#7a6482;--pink:#ff8fc0;--blue:#9ccaff;--line:#f6cfe3;--card:rgba(255,255,255,.86);
color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:#fff;color:var(--ink);font:400 17px/1.6 Nunito,system-ui,sans-serif}
#swirl{position:fixed;left:-40px;top:-40px;width:calc(100% + 80px);height:calc(100% + 80px);z-index:-1}
main{max-width:760px;margin:0 auto;padding:28px 20px 64px;text-align:center}
h1,h2{font-family:Clevicute,Fredoka,Nunito,sans-serif;font-weight:600;line-height:1.15;margin:0}
h1{font-size:clamp(2.4rem,10vw,4rem);margin-top:24px}
.navbar {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 10px;
  max-width: 760px;
  margin: 18px auto 0;
  padding: 0 20px;
}
.navbar a {
  font: 600 0.95rem Fredoka, sans-serif;
  text-decoration: none;
  color: var(--ink);
  background: var(--card);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  border: 2px solid var(--line);
  border-radius: 999px;
  padding: 6px 18px;
  transition: transform 0.1s ease, border-color 0.15s ease;
}
.navbar a:hover {
  border-color: var(--pink);
  transform: translateY(-2px);
}
.navbar a:active {
  transform: translateY(1px);
}
</style>
</head>
<body id="Home">

<svg id="swirl" viewBox="0 0 1000 1000" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
  <defs>
    <filter id="warp" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.006" numOctaves="2" seed="4" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="140" xChannelSelector="R" yChannelSelector="G"/>
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <radialGradient id="fade"><stop offset="0.45" stop-color="#fff"/><stop offset="1" stop-color="#000"/></radialGradient>
    <mask id="m"><rect width="1000" height="1000" fill="#000"/><circle cx="800" cy="820" r="480" fill="url(#fade)"/></mask>
  </defs>
  <rect width="1000" height="1000" fill="#fff"/>
  <g filter="url(#warp)"><g id="a"></g><g id="b" mask="url(#m)"></g></g>
</svg>

<div class="navbar">
  <a href="https://pbjbean.github.io/erotabbymodpack">Home</a>
  <a href="https://youtube.com/@sinewave.tv2">Watch on Youtube</a>
  <a href="about:blank" onclick="alert('Oop, There\'s nothing to be seen'); return false;">Guide W.I.P</a>
  <a href="https://pbjbean.github.io/erotabbymodpack/Download">Download Modpack</a>
</div>

<main>
  <h1>Diary of a minecraft girl</h1>
  <p>Welcome to the DOAMG website!</p>
  <p>You can download the official modpack that Erotabby uses, watch the show on youtube, access the erotabby wiki</p>
</main>

<script>
(function(){
  var NS="http://www.w3.org/2000/svg", N=8;
  var cols=["#ffb5d8","#ffffff","#b0d6ff","#ffffff","#ffc8e2","#ffffff","#c2e0ff","#ffffff"];
  function spiral(g,cx,cy,b){
    var T=1600/b, steps=500;
    for(var i=0;i<N;i++){
      var pts=[],s,t,a,r;
      for(s=0;s<=steps;s++){t=T*s/steps;a=t+2*Math.PI*i/N;r=b*t;pts.push((cx+r*Math.cos(a)).toFixed(1)+","+(cy+r*Math.sin(a)).toFixed(1));}
      for(s=steps;s>=0;s--){t=T*s/steps;a=t+2*Math.PI*(i+1)/N;r=b*t;pts.push((cx+r*Math.cos(a)).toFixed(1)+","+(cy+r*Math.sin(a)).toFixed(1));}
      var p=document.createElementNS(NS,"polygon");
      p.setAttribute("points",pts.join(" "));p.setAttribute("fill",cols[i]);g.appendChild(p);
    }
  }
  spiral(document.getElementById("a"),250,200,34);
  spiral(document.getElementById("b"),800,820,28);
})();
</script>
</body>
</html>
